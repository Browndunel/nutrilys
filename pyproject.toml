[project]
name = "nutrilys"
version = "0.1.0"
description = "Cartographie de la qualité nutritionnelle des produits alimentaires à partir d'Open Food Facts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "huggingface-hub>=0.26",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Fine-tuning du transformer (étape 7). Installé à part car lourd :
# sans GPU, cette étape tourne sur Google Colab.
nlp = [
    "torch>=2.4",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrilys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
